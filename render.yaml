# PeopleFlow HRMS – no paid resources in this Blueprint.
# Use a separate PostgreSQL database (for example, Neon's Free plan).
# Never put a database password or connection string in source control.
services:
  - type: web
    name: peopleflow-hrms-app
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
# No databases: this Blueprint does not create a paid Render Postgres instance.
